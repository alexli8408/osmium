name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-misc

      # rust-toolchain.toml pins the channel, components, and the
      # riscv64gc-unknown-none-elf target; rustup picks it up automatically.
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Build
        run: cargo build

      - name: Boot test (QEMU)
        run: make test
